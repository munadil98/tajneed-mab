    <script>
      // Fallback redirect for GitHub Pages deployments configured to serve from root
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var path = window.location.pathname;
        var target = path.endsWith('/') ? path + 'docs/' : path + '/docs/';
        window.location.replace(target);
      }
    </script>
